<!DOCTYPE html>
<html>
<head>
    <title>Change Background Color</title>
</head>
<body>

    <h1>Background Color Changer</h1>

    <button onclick="changeColor()">Change Background</button>

    <script>
        function changeColor() {
            document.body.style.backgroundColor = "lightblue";
        }
    </script>

</body>
</html>
