<!DOCTYPE html>
<html>
<head>
    <title>Keydown Event</title>
</head>
<body>

    <h1>Keyboard Event</h1>

    <input
        type="text"
        id="input"
        placeholder="Press any key">

    <p id="message"></p>

    <script>
        document.getElementById("input").addEventListener(
            "keydown",
            function(event) {

                document.getElementById("message").innerHTML =
                    "You pressed the key: " + event.key;
            }
        );
    </script>

</body>
</html>
