<!DOCTYPE html>
<html>
<head>
    <title>Onclick Event</title>
</head>
<body>

    <h1>JavaScript onclick Event</h1>

    <button onclick="showMessage()">
        Click Me
    </button>

    <script>
        function showMessage() {
            alert("Hello! Button was clicked.");
        }
    </script>

</body>
</html>
