<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        img {
            width: 500px;
            height: 300px;
            object-fit: cover;
            border: 2px solid black;
        }

        button {
            padding: 10px 20px;
            margin: 15px 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Simple Image Gallery</h1>

    <img id="galleryImage"
         src="https://picsum.photos/id/1015/500/300"
         alt="Gallery Image">

    <br>

    <button id="previous">Previous</button>
    <button id="next">Next</button>

    <script>
        let images = [
            "https://picsum.photos/id/1015/500/300",
            "https://picsum.photos/id/1016/500/300",
            "https://picsum.photos/id/1018/500/300",
            "https://picsum.photos/id/1025/500/300"
        ];

        let currentIndex = 0;

        let image =
            document.getElementById("galleryImage");

        document.getElementById("next")
            .addEventListener("click", function() {

                currentIndex++;

                if (currentIndex >= images.length) {
                    currentIndex = 0;
                }

                image.src = images[currentIndex];
            });

        document.getElementById("previous")
            .addEventListener("click", function() {

                currentIndex--;

                if (currentIndex < 0) {
                    currentIndex = images.length - 1;
                }

                image.src = images[currentIndex];
            });
    </script>

</body>
</html>
