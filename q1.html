<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Data Types</title>
</head>
<body>

    <h1>JavaScript Data Types</h1>
    <div id="output"></div>

    <script>
        let name = "Harshith";       // String
        let age = 20;                // Number
        let isStudent = true;        // Boolean
        let marks;                   // Undefined
        let emptyValue = null;       // Null
        let fruits = ["Apple", "Mango", "Banana"]; // Array
        let student = {
            course: "B.Tech CSE",
            university: "GITAM"
        }; // Object

        document.getElementById("output").innerHTML =
            "<p><b>String:</b> " + name + "</p>" +
            "<p><b>Number:</b> " + age + "</p>" +
            "<p><b>Boolean:</b> " + isStudent + "</p>" +
            "<p><b>Undefined:</b> " + marks + "</p>" +
            "<p><b>Null:</b> " + emptyValue + "</p>" +
            "<p><b>Array:</b> " + fruits.join(", ") + "</p>" +
            "<p><b>Object:</b> Course = " + student.course +
            ", University = " + student.university + "</p>";
    </script>

</body>
</html>
